name: CI

on:
  push:
    branches: [main]
  pull_request:

# actions/checkout fetches the repository with GITHUB_TOKEN, which requires
# at least contents:read; nothing in this workflow needs any other scope.
permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and lint
        run: pnpm check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Build example
        run: pnpm build:example

      - name: Verify package exports
        run: pnpm verify:exports

      - name: Test
        run: pnpm test
