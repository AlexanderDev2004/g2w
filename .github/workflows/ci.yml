name: CI

on:
  push:
    branches: [main]
  pull_request:

# actions/checkout fetches the repository with GITHUB_TOKEN, which requires
# at least contents:read; nothing in this workflow needs any other scope.
permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and lint
        run: pnpm check

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Build example
        run: pnpm build:example

      - name: Verify package exports
        run: pnpm verify:exports

      - name: Test
        run: pnpm test
