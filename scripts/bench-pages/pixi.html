<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>bench: PixiJS raw</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #14141e;
        color: #eee;
        font-family: system-ui, sans-serif;
      }
      #bench-error {
        color: #ff6b6b;
        white-space: pre-wrap;
        max-width: 640px;
      }
    </style>
  </head>
  <body>
    <div>
      <canvas id="bench-canvas" width="640" height="360"></canvas>
      <pre id="bench-error" hidden></pre>
    </div>
    <script type="module">
      // Cross-framework runtime benchmark: the same N-sprite orbit workload as
      // the g2w page, built directly on PixiJS 8 (the renderer g2w adapts).
      // This is the baseline that shows how much the g2w adapter layer adds.
      import { createCounters, makeTileCanvas, markFrame, orbit, showError, spriteCountFromUrl, VIEW_HEIGHT, VIEW_WIDTH } from "./bench-common.js";

      try {
        // Dynamic import inside try: a failed CDN fetch surfaces in the error
        // box instead of silently never running the module.
        // jsDelivr's +esm build ships the complete package entry (the esm.sh
        // split build leaves the ticker extension unregistered).
        const { Application, Sprite, Texture } = await import("https://cdn.jsdelivr.net/npm/pixi.js@8.22.0/+esm");
        const spritesCount = spriteCountFromUrl();
        const counters = createCounters(spritesCount);

        const app = new Application();
        await app.init({ canvas: document.querySelector("#bench-canvas"), width: VIEW_WIDTH, height: VIEW_HEIGHT, background: "#1099bb", resolution: 1 });
        const texture = Texture.from(makeTileCanvas());

        const sprites = [];
        for (let i = 0; i < spritesCount; i++) {
          const phase = (i / spritesCount) * Math.PI * 2;
          const sprite = new Sprite(texture);
          sprite.anchor.set(0.5);
          sprite.scale.set(0.75);
          sprite.position.set(VIEW_WIDTH / 2, VIEW_HEIGHT / 2);
          sprite.phase = phase;
          sprites.push(sprite);
          app.stage.addChild(sprite);
        }

        app.ticker.add(() => {
          const age = performance.now() / 1000;
          for (const sprite of sprites) {
            const state = orbit(age, sprite.phase);
            sprite.position.set(state.x, state.y);
            sprite.rotation = state.rotation;
          }
          markFrame(counters);
        });
      } catch (error) {
        showError(error);
      }
    </script>
  </body>
</html>
