# Deploy the documentation website to Cloudflare Pages.
#
# Deploys on every push to main that touches website/ (plus manual dispatch).
# Uses the Direct Upload flow: build the Astro site, then `wrangler pages deploy`
# with the CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID repository secrets.
# The custom domain g2w.alexanderar.com must be attached to the Pages project
# once in the Cloudflare dashboard (or via the Cloudflare API); it is
# intentionally not managed by this workflow.

name: Deploy website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"

permissions:
  contents: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Install dependencies
        working-directory: website
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: website
        run: pnpm build

      - name: Deploy to Cloudflare Pages
        working-directory: website
        run: pnpm dlx wrangler@latest pages deploy dist --project-name g2w-website --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
