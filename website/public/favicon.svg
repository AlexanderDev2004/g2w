<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 12 12" shape-rendering="crispEdges">
  <!-- G2W favicon: "2" (orange, the transform) over a d-pad, in an ink frame.
       Source of truth: the pixel grids in website/src/lib/marks.ts -->
  <rect width="12" height="12" fill="#f2efe6"/>
  <rect x="0" y="0" width="12" height="1" fill="#191610"/>
  <rect x="0" y="11" width="12" height="1" fill="#191610"/>
  <rect x="0" y="0" width="1" height="12" fill="#191610"/>
  <rect x="11" y="0" width="1" height="12" fill="#191610"/>
  <!-- "2" -->
  <rect x="5" y="2" width="3" height="1" fill="#ff4d00"/>
  <rect x="4" y="3" width="1" height="1" fill="#ff4d00"/>
  <rect x="7" y="3" width="2" height="1" fill="#ff4d00"/>
  <rect x="6" y="4" width="2" height="1" fill="#ff4d00"/>
  <rect x="5" y="5" width="1" height="1" fill="#ff4d00"/>
  <rect x="4" y="6" width="5" height="1" fill="#ff4d00"/>
  <!-- d-pad plus -->
  <rect x="6" y="8" width="1" height="1" fill="#191610"/>
  <rect x="5" y="9" width="3" height="1" fill="#191610"/>
  <rect x="6" y="10" width="1" height="1" fill="#191610"/>
</svg>
